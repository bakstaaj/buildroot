server.modules = (
	"mod_access",
	"mod_alias",
	"mod_proxy",
)

server.document-root = "/www"
server.port = 80
server.bind = "0.0.0.0"
server.pid-file = "/var/run/lighttpd.pid"
server.errorlog = "/var/run/lighttpd-error.log"
server.network-backend = "writev"

index-file.names = ( "index.html" )
dir-listing.activate = "disable"

mimetype.assign = (
	".html" => "text/html",
	".css" => "text/css",
	".js" => "application/javascript",
	".json" => "application/json",
	".png" => "image/png",
	".jpg" => "image/jpeg",
	".jpeg" => "image/jpeg",
	".svg" => "image/svg+xml",
	".ico" => "image/x-icon",
	".txt" => "text/plain",
)

$HTTP["url"] =~ "^/(cgi-bin/pluto-radio-api|cgi-bin/pluto-metrics.cgi|cgi-bin/pluto-settings.cgi|cgi-bin/pluto-files.cgi|radio/|system/|capture/|audio/|spectrum/|doppler/|dashboard/)" {
	proxy.server = (
		"" => (
			(
				"host" => "127.0.0.1",
				"port" => 8081,
			)
		)
	)
}
