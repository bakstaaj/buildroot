server.modules = (
	"mod_access",
	"mod_alias",
	"mod_proxy",
)

server.document-root = "/www"
server.port = 80
server.bind = "0.0.0.0"
server.pid-file = "/var/run/lighttpd.pid"
server.errorlog = "/var/run/lighttpd-error.log"
server.network-backend = "writev"
# Audio and spectrum endpoints are indefinite proxy responses. Forward their
# bytes as they arrive instead of buffering until the backend closes.
server.stream-response-body = 2

index-file.names = ( "index.html" )

mimetype.assign = (
	".html" => "text/html",
	".css" => "text/css",
	".js" => "application/javascript",
	".json" => "application/json",
	".png" => "image/png",
	".jpg" => "image/jpeg",
	".jpeg" => "image/jpeg",
	".svg" => "image/svg+xml",
	".ico" => "image/x-icon",
	".txt" => "text/plain",
)

proxy.server = (
	"/radio/" => (
		(
			"host" => "127.0.0.1",
			"port" => 8081,
		)
	),
	"/system/" => (
		(
			"host" => "127.0.0.1",
			"port" => 8081,
		)
	),
	"/capture/" => (
		(
			"host" => "127.0.0.1",
			"port" => 8081,
		)
	),
	"/audio/" => (
		(
			"host" => "127.0.0.1",
			"port" => 8081,
		)
	),
	"/spectrum/" => (
		(
			"host" => "127.0.0.1",
			"port" => 8081,
		)
	),
	"/doppler/" => (
		(
			"host" => "127.0.0.1",
